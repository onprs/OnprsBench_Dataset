rubric_version: 1
dimensions:
  - id: correctness
    weight: 0.75
    description: 程序 verifier 判定：通过官方样例，且通过生成器产生的应力测试集（期望输出由官方参考代码计算，并经暴力对拍确认）。
    anchors:
      - score: 0.0
        description: 官方样例未通过。
      - score: 0.5
        description: 样例通过但应力测试存在失败用例。
      - score: 1.0
        description: 样例与应力测试全部通过。

  - id: efficiency
    weight: 0.25
    description: 复杂度满足约束：在题目时限（2s）内处理最大规模输入（Σn ≤ 2e5，a_i < 2^18）。满分要求 O(18n log n) 或更优（笛卡尔树 + 小到大合并）。
    anchors:
      - score: 0.0
        description: 枚举所有区间（O(n²) 及更差），无法完成最大规模。
      - score: 0.5
        description: 使用了笛卡尔树但合并未做小到大（O(n²) 或 O(n log² n) 的最坏情形），最大规模下不稳定。
      - score: 1.0
        description: 按位贪心 + 笛卡尔树小到大合并，O(18n log n)，最大规模在时限内完成。
