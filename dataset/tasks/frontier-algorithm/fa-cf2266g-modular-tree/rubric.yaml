rubric_version: 1
dimensions:
  - id: correctness
    weight: 0.75
    description: 程序 verifier 判定：通过官方样例，且通过生成器产生的应力测试集（期望输出由官方参考代码计算，并经暴力对拍确认）。
    anchors:
      - score: 0.0
        description: 官方样例未通过。
      - score: 0.5
        description: 样例通过但应力测试存在失败用例。
      - score: 1.0
        description: 样例与应力测试全部通过。

  - id: efficiency
    weight: 0.25
    description: 复杂度满足约束：在题目时限（3s）内处理最大规模输入（Σn ≤ 2e5）。满分要求 O(n log C)（自底向上 gcd 递推，C 为模数上界）。
    anchors:
      - score: 0.0
        description: 搜索可达状态或对每个节点做指数级枚举。
      - score: 0.5
        description: 得到递推但每个节点重复遍历子树，复杂度 O(n²) 级别。
      - score: 1.0
        description: 自底向上一次遍历完成 gcd 递推，O(n log C)，最大规模在时限内完成。
