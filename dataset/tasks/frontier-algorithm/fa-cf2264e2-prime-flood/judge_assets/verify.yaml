  output_dir: imported/cf/2264e2/
  # 对规范化文本（UTF-8、LF 换行）计算的 sha256 前 16 位；用于核对上游内容是否变动
  content_sha256:
    statement.txt: 1dde205e00edc8d1
    samples.json: 4b6159855005494b
    editorial.txt: 5c7593705bc9d18e
    official.cpp: cb755feeb810b452

evaluation:
  mode: 程序判题
  # 判定期望输出来源（编译后运行），路径相对任务根
  reference_solution: judge_assets/reference_solution.cpp
  # 官方样例 [{input, output}]，路径相对任务根
  samples: judge_assets/samples.json
  # 应力测试：generator.py 生成输入，期望输出由 reference_solution 计算
  harness:
    generator: judge_assets/generator.py
    brute_force: judge_assets/brute_force.py

verification:
