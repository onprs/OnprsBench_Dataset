rubric_version: 1
dimensions:
  - id: correctness
    weight: 0.75
    description: 程序 verifier 判定：通过官方样例，且通过生成器产生的应力测试集（期望输出由官方参考代码计算，并经暴力对拍确认）。
    anchors:
      - score: 0.0
        description: 官方样例未通过。
      - score: 0.5
        description: 样例通过但应力测试存在失败用例。
      - score: 1.0
        description: 样例与应力测试全部通过。

  - id: efficiency
    weight: 0.25
    description: 复杂度满足约束：在题目时限（2s）内处理最大规模输入（Σn ≤ 1e6）。满分要求 O(n)（单调栈求 R_i + 一次线性 dp）。
    anchors:
      - score: 0.0
        description: 对每对 (i,j) 做 BFS 或 O(n³) 以上做法。
      - score: 0.5
        description: 有正确 dp 但求可达位置/计数需要 O(n log n) 以上的结构且常数过大，或存在 O(n²) 分支。
      - score: 1.0
        description: 单调栈与线性 dp，O(n)，最大规模在时限内完成。
