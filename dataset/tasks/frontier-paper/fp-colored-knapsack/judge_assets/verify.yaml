# 程序验证契约与对拍记录
source:
  paper: arXiv:2609.17713
  title: A tight 1/3-approximation algorithm and fully polynomial-time approximation schemes for the Colored Knapsack Problem
  authors: [Fabio Ciccarelli, Fabio Furini]
  published_at: "2026-09-15"
  license: CC BY 4.0
  paper_url: https://arxiv.org/abs/2609.17713
  limits: { time: "3s", memory: "256MB", max_n: 28, max_b: 300, max_t: 50 }

redistribution: metadata_only   # 仅登记来源元数据；题面、参考解与生成器为独立撰写

evaluation:
  mode: 程序判题
  # 判定期望输出来源（编译后运行），路径相对任务根
  reference_solution: judge_assets/reference_solution.cpp
  # 样例 [{input, output}]，路径相对任务根
  samples: judge_assets/samples.json
  # 应力测试：generator.py 生成输入，期望输出由 reference_solution 计算
  harness:
    generator: judge_assets/generator.py
    brute_force: judge_assets/brute_force.py

verification:
  verified_at: "2026-10-06"
  method: 参考解（按论文颜色可行性刻画与 (t,d,a) 状态减少设计容量索引 DP，g++ -O2 编译）与独立暴力枚举（枚举全部子集并逐一检查容量与颜色可行性）对拍
  scope: 1500 组小用例（n ≤ 13、b ≤ 30）；80 组中等用例（n ∈ [14,18]）；另测上限规模 n = 28、b = 300 的 5 组用例
  result: 对拍全部一致；5 组上限用例总耗时约 0.29 秒
