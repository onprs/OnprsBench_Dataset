# 程序验证契约与复现记录
repo: python-attrs/attrs
repo_url: https://github.com/python-attrs/attrs
base_commit: 6851ab593cd25f3c14393e9355d57d22bec2a074
fix_pr: https://github.com/python-attrs/attrs/pull/1593
license: MIT

environment:
  python: "3.14"
  os_notes: 已在 Windows 11 本机环境验证；目标测试要求 Python >= 3.14（低版本按 skipif 跳过）
  setup:
    - git clone https://github.com/python-attrs/attrs
    - git checkout 6851ab593cd25f3c14393e9355d57d22bec2a074
    - pip install -e . pytest hypothesis

evaluation:
  # 评测时序：base_commit -> 应用 test.patch -> 被测模型修复源码 -> 运行测试
  apply:
    - judge_assets/test.patch
  fail_to_pass:
    - "tests/test_annotations.py::TestAnnotations::test_missing_classvar_import"
    - "tests/test_annotations.py::test_is_class_var[annot4]"
  pass_to_pass:
    - "tests/test_annotations.py"
  reference_fix: judge_assets/fix.patch

verification:
  verified_at: "2026-10-06"
  method: 本地完整复现
  steps:
    - "base + test.patch：tests/test_annotations.py 3 项失败、47 项通过（test_missing_classvar_import[True]/[False] 与 test_is_class_var[annot4]）"
    - "再应用 fix.patch：tests/test_annotations.py 50 项全部通过"
