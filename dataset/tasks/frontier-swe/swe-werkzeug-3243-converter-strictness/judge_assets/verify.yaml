# 程序验证契约与复现记录
repo: pallets/werkzeug
repo_url: https://github.com/pallets/werkzeug
base_commit: ef518e429b67a91a307de37a1845c93110180371
fix_pr: https://github.com/pallets/werkzeug/pull/3243
license: BSD-3-Clause

environment:
  python: "3.14"
  os_notes: 已在 Windows 11 本机环境验证；仓库为纯 Python，预期跨平台一致
  setup:
    - git clone https://github.com/pallets/werkzeug
    - git checkout ef518e429b67a91a307de37a1845c93110180371
    - pip install -e . pytest ephemeral-port-reserve

evaluation:
  # 评测时序：base_commit -> 应用 test.patch -> 被测模型修复源码 -> 运行测试
  apply:
    - judge_assets/test.patch
  fail_to_pass:
    - "tests/test_routing.py::test_converter"
  pass_to_pass:
    - "tests/test_routing.py"
  reference_fix: judge_assets/fix.patch

verification:
  verified_at: "2026-10-06"
  method: 本地完整复现
  steps:
    - "base + test.patch：tests/test_routing.py 11 项失败、175 项通过（test_converter 的 11 个参数化用例失败，含 Unicode 数字、fixed_digits 负号、inf 构建、科学计数法等）"
    - "再应用 fix.patch：tests/test_routing.py 186 项全部通过"
