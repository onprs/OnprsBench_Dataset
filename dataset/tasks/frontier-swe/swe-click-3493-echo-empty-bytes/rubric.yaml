rubric_version: 1
dimensions:
  - id: patch_correctness
    weight: 0.60
    description: 程序 verifier 判定：FAIL_TO_PASS 测试通过且 PASS_TO_PASS 无回归。
    anchors:
      - score: 0.0
        description: FAIL_TO_PASS 测试仍失败。
      - score: 0.5
        description: FAIL_TO_PASS 通过但 PASS_TO_PASS 出现回归。
      - score: 1.0
        description: FAIL_TO_PASS 通过且 PASS_TO_PASS 无回归。

  - id: root_cause
    weight: 0.20
    description: 修复是否针对根因——`out = out or ""` 把空 bytes 误判为假值并转成 str，导致二进制流写入 str；修复应保持空 bytes 的类型不变。
    anchors:
      - score: 0.0
        description: 未识别 `or` 的假值陷阱，或在调用侧/测试侧打补丁。
      - score: 0.5
        description: 只对空 bytes 特判，破坏 None、空 str 等其他分支的既有语义。
      - score: 1.0
        description: 正确区分 None 与"空但类型有效"的输入，所有分支行为保持正确。

  - id: regression_risk
    weight: 0.20
    description: 既有行为保持：echo(None)、echo("")、echo(b"x")、非 str/bytes 对象转 str 等路径不回归。
    anchors:
      - score: 0.0
        description: 引入新的类型错误或改变既有输出。
      - score: 0.5
        description: 主要路径正确但个别分支行为变化。
      - score: 1.0
        description: 全部分支行为与上游修复一致。
