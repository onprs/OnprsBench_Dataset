rubric_version: 1
dimensions:
  - id: patch_correctness
    weight: 0.60
    description: 程序 verifier 判定：FAIL_TO_PASS 测试通过且 PASS_TO_PASS 无回归。
    anchors:
      - score: 0.0
        description: FAIL_TO_PASS 测试仍失败。
      - score: 0.5
        description: FAIL_TO_PASS 通过但 PASS_TO_PASS 出现回归。
      - score: 1.0
        description: FAIL_TO_PASS 通过且 PASS_TO_PASS 无回归。

  - id: root_cause
    weight: 0.20
    description: 修复是否同时处理标量与逐元素两个问题——纯标量赋值保持中缀运算；数组表达式中的逐元素函数应用可打印，且按操作数优先级正确加括号。
    anchors:
      - score: 0.0
        description: 仅在赋值打印处跳过数组化，逐元素函数仍无法打印或打印结果优先级错误。
      - score: 0.5
        description: 标量场景正确，逐元素函数在部分操作数形态（复合表达式、矩阵表达式）下括号或展开错误。
      - score: 1.0
        description: 标量与逐元素路径均与上游修复一致，含矩阵操作数与嵌套函数体。

  - id: regression_risk
    weight: 0.20
    description: 既有数组打印输出保持：`ArrayAdd`、`ArrayTensorProduct`、`ArrayDiagonal`、`PermuteDims`、`ArrayContraction`、`assignment` 与 `convert_indexed_to_array` 的既有结果。
    anchors:
      - score: 0.0
        description: 数组表达式输出变化或退化。
      - score: 0.5
        description: 主路径正确，个别数组形态输出变化。
      - score: 1.0
        description: 全部既有数组打印场景与上游修复一致。
