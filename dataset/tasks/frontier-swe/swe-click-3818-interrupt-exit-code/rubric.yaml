rubric_version: 1
dimensions:
  - id: patch_correctness
    weight: 0.60
    description: 程序 verifier 判定：FAIL_TO_PASS 测试通过且 PASS_TO_PASS 无回归。
    anchors:
      - score: 0.0
        description: FAIL_TO_PASS 测试仍失败。
      - score: 0.5
        description: FAIL_TO_PASS 通过但 PASS_TO_PASS 出现回归。
      - score: 1.0
        description: FAIL_TO_PASS 通过且 PASS_TO_PASS 无回归。

  - id: root_cause
    weight: 0.20
    description: 修复是否针对根因——报告消息与退出的动作发生在最外层 `try` 之外，第二次 `KeyboardInterrupt` 无法被兜底；应先确定消息与退出码，再在受保护区域完成输出与退出。
    anchors:
      - score: 0.0
        description: 只在 `echo` 调用处就地加 try/except，或吞掉所有 `KeyboardInterrupt` 并改变退出码。
      - score: 0.5
        description: 覆盖了 `Abort`/`ClickException` 场景，但成功退出或非 standalone 模式下仍有未被兜底的窗口。
      - score: 1.0
        description: 统一收集消息与退出码后在受保护区域输出并退出；迟到的中断至多丢失消息，不影响既有退出码。

  - id: regression_risk
    weight: 0.20
    description: 既有契约保持：`Aborted!` 消息、`standalone_mode=False` 下首个中断以 `Abort`（带 `__cause__`）抛出、`ClickException.exit_code`、EPIPE 静默、成功时退出码 0。
    anchors:
      - score: 0.0
        description: 破坏既有退出码或异常类型契约。
      - score: 0.5
        description: 主路径正确，但个别场景（如非 standalone 模式、成功退出）行为变化。
      - score: 1.0
        description: 全部既有契约与上游修复一致。
