# 程序验证契约与复现记录
repo: pallets/click
repo_url: https://github.com/pallets/click
base_commit: 8b44edfff7d9a6c895fa804148c16b3a0bc9efb5
fix_pr: https://github.com/pallets/click/pull/3769
license: BSD-3-Clause

environment:
  python: "3.14"
  os_notes: 已在 Windows 11 本机环境验证；仓库为纯 Python，预期跨平台一致
  setup:
    - git clone https://github.com/pallets/click
    - git checkout 8b44edfff7d9a6c895fa804148c16b3a0bc9efb5
    - pip install -e . pytest

evaluation:
  apply:
    - judge_assets/test.patch
  fail_to_pass:
    - "tests/test_termui.py::test_progressbar_lands_on_final_position"
  pass_to_pass:
    - "tests/test_termui.py"
  reference_fix: judge_assets/fix.patch

verification:
  verified_at: "2026-10-05"
  method: 本地完整复现
  steps:
    - "base + test.patch：目标测试 12 个参数化用例中 6 个失败（[update-3]、[update-7]、[update-25] 等）"
    - "再应用 fix.patch：12 个参数化用例全部通过"
    - "回归：tests/test_termui.py 249 项通过、11 项跳过"
