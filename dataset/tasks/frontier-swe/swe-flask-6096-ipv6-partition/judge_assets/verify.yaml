# 程序验证契约与复现记录
repo: pallets/flask
repo_url: https://github.com/pallets/flask
base_commit: 514fc6b3e8402e4c646d5284e97a4f0ab50a7c4b
fix_pr: https://github.com/pallets/flask/pull/6096
license: BSD-3-Clause

environment:
  python: "3.14"
  os_notes: 已在 Windows 11 本机环境验证；仓库为纯 Python，预期跨平台一致
  setup:
    - git clone https://github.com/pallets/flask
    - git checkout 514fc6b3e8402e4c646d5284e97a4f0ab50a7c4b
    - pip install -e . pytest

evaluation:
  # 评测时序：base_commit -> 应用 test.patch -> 被测模型修复源码 -> 运行测试
  apply:
    - judge_assets/test.patch
  fail_to_pass:
    - "tests/test_testing.py::test_session_transaction_ipv6"
    - "tests/test_basic.py::test_run_from_config[None-None-[::1]:8080-::1-8080]"
  pass_to_pass:
    - "tests/test_testing.py"
    - "tests/test_basic.py"
  reference_fix: judge_assets/fix.patch

verification:
  verified_at: "2026-10-05"
  method: 本地完整复现
  steps:
    - "base + test.patch：2 项目标测试均失败（AssertionError / 解析错误）"
    - "再应用 fix.patch：目标测试全部通过"
    - "回归：tests/test_testing.py + tests/test_basic.py 共 159 项全部通过"
