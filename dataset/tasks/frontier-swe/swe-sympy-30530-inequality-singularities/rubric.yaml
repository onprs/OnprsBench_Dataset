rubric_version: 1
dimensions:
  - id: patch_correctness
    weight: 0.60
    description: 程序 verifier 判定：FAIL_TO_PASS 测试通过且 PASS_TO_PASS 无回归。
    anchors:
      - score: 0.0
        description: FAIL_TO_PASS 测试仍失败。
      - score: 0.5
        description: FAIL_TO_PASS 通过但 PASS_TO_PASS 出现回归。
      - score: 1.0
        description: FAIL_TO_PASS 通过且 PASS_TO_PASS 无回归。

  - id: root_cause
    weight: 0.20
    description: 修复是否在归约到 `(expr, rel)` 之前识别并保留会因左右相减而消失的分母零点（含多因子、非多项式分母），并把无法解出单点的分母限制以 `d != 0` 形式保留。
    anchors:
      - score: 0.0
        description: 只对特定表达式打补丁，或在结果上补 `Ne` 而遗漏多因子/复合分母。
      - score: 0.5
        description: 处理了常见有理分母，但复合分母（如 `sin(x)`）、重数与浮点系数场景仍有遗漏。
      - score: 1.0
        description: 归约前完整保留分母约束，覆盖单因子、多因子、复合分母与重数衰减场景。

  - id: regression_risk
    weight: 0.20
    description: 既有不等式求解行为保持：多表达式交集/并集、绝对值不等式、`reduce_rational_inequalities` 的区间输出、`solve_univariate_inequality` 的显式区间。
    anchors:
      - score: 0.0
        description: 既有解集形状改变（区间变 ConditionSet 或丢解）。
      - score: 0.5
        description: 主路径正确，个别组合场景结果变化。
      - score: 1.0
        description: 全部既有场景与上游修复行为一致。
