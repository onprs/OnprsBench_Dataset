# 程序验证契约与复现记录
repo: sympy/sympy
repo_url: https://github.com/sympy/sympy
base_commit: 31e03dc7ed8114117274ea679be1835044cec9c9
fix_pr: https://github.com/sympy/sympy/pull/30530
license: BSD-3-Clause

environment:
  python: "3.14"
  os_notes: 已在 Windows 11 本机环境验证；仓库为纯 Python（含 mpmath 依赖）
  setup:
    - git clone https://github.com/sympy/sympy
    - git checkout 31e03dc7ed8114117274ea679be1835044cec9c9
    - pip install -e . pytest hypothesis

evaluation:
  # 评测时序：base_commit -> 应用 test.patch -> 被测模型修复源码 -> 运行测试
  apply:
    - judge_assets/test.patch
  fail_to_pass:
    - "sympy/solvers/tests/test_inequalities.py::test_issue_30529"
    - "sympy/solvers/tests/test_inequalities.py::test_solve_univariate_inequality_random_symbol"
  pass_to_pass:
    - "sympy/solvers/tests/test_inequalities.py"
  reference_fix: judge_assets/fix.patch

verification:
  verified_at: "2026-10-06"
  method: 本地完整复现
  steps:
    - "base：reduce_inequalities(1/x <= 1/x, x) 返回 True（应为 Ne(x, 0)）；reduce_inequalities(1/sin(x) <= 1/sin(x), x) 返回 True"
    - "base + test.patch：sympy/solvers/tests/test_inequalities.py 2 项失败、28 项通过、2 项 xfail"
    - "再应用 fix.patch：30 项通过、2 项 xfail"
